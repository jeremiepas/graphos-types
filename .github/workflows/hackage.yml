name: graphos-types

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: latest

      - name: Build (dev flag, tests enabled)
        run: cabal build --flag dev

      - name: Run specs
        run: cabal test --test-show-details=direct

  publish:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: latest

      - name: Build source distribution
        run: cabal sdist

      - name: Publish to Hackage
        run: cabal upload --publish --token ${{ secrets.HACKAGE_API_KEY }} dist-newstyle/sdist/*.tar.gz
